<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Connect Spotify (one time)</title>
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 18px;color:#332A2C;line-height:1.5}
h1{font-size:22px}code,textarea{font-family:ui-monospace,monospace;font-size:13px}
input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1.5px solid #C99A84;border-radius:8px;font-size:15px}
button{background:#C2285B;color:#fff;border:0;border-radius:999px;padding:12px 26px;font-size:15px;cursor:pointer;margin-top:12px}
.box{background:#FBE8DD;border-radius:10px;padding:12px 14px;margin:14px 0;word-break:break-all}
.err{color:#B3261E}
</style></head><body>
<h1>Connect Spotify (one time)</h1>
<div id="step1">
  <p>1. In your Spotify app settings, add this as a <b>Redirect URI</b> and save:</p>
  <div class="box" id="redir"></div>
  <p>2. Paste your Spotify app <b>Client ID</b>:</p>
  <input id="cid" autocomplete="off" placeholder="Client ID">
  <button id="go" type="button">Connect Spotify</button>
</div>
<div id="step2" hidden>
  <p id="status">Getting your token...</p>
  <textarea id="out" rows="4" readonly hidden></textarea>
</div>
<script>
const redirect = location.origin + location.pathname;
document.getElementById('redir').textContent = redirect;
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function rnd(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return b64(a).slice(0,n); }
document.getElementById('go').addEventListener('click', async () => {
  const cid = document.getElementById('cid').value.trim();
  if (!cid) return;
  const verifier = rnd(64);
  const challenge = b64(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  sessionStorage.setItem('v', verifier); sessionStorage.setItem('c', cid);
  const p = new URLSearchParams({ response_type:'code', client_id:cid, scope:'playlist-modify-public playlist-modify-private',
    redirect_uri:redirect, code_challenge_method:'S256', code_challenge:challenge });
  location.href = 'https://accounts.spotify.com/authorize?' + p;
});
const code = new URLSearchParams(location.search).get('code');
if (code) (async () => {
  document.getElementById('step1').hidden = true; document.getElementById('step2').hidden = false;
  const st = document.getElementById('status');
  try {
    const r = await fetch('https://accounts.spotify.com/api/token', { method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({ grant_type:'authorization_code', code, redirect_uri:redirect,
        client_id:sessionStorage.getItem('c')||'', code_verifier:sessionStorage.getItem('v')||'' }) });
    const j = await r.json();
    if (!j.refresh_token) throw new Error(j.error_description || j.error || 'No token returned');
    st.textContent = 'Done. Copy this refresh token into Vercel as SPOTIFY_REFRESH_TOKEN, then delete this page from the site:';
    const o = document.getElementById('out'); o.value = j.refresh_token; o.hidden = false; o.select();
  } catch (e) { st.className = 'err'; st.textContent = 'Something went wrong: ' + e.message; }
})();
</script></body></html>
